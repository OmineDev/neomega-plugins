name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned public SDK and checker
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/neomega-toolkit.tar.gz" https://wiki.wuxie233.com/downloads/neomega-toolkit-1.3.0-linux-amd64.tar.gz
          echo "978a1af47f5139cac81f00ee2de3d847654f612283742fec94f012e8ec6bccaf  $RUNNER_TEMP/neomega-toolkit.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/neomega-toolkit"
          tar -xzf "$RUNNER_TEMP/neomega-toolkit.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/neomega-toolkit"
          (cd "$RUNNER_TEMP/neomega-toolkit" && sha256sum --check --quiet FILES.sha256)
          echo "NEOMEGA_TOOLKIT=$RUNNER_TEMP/neomega-toolkit" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH="$NEOMEGA_TOOLKIT/sdk/python" python3 tools/check-plugins.py
      - run: python3 -m unittest discover -s tests
