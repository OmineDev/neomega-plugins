[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "neomega-clients"
version = "1.1.0"
requires-python = ">=3.10"
description = "Typed clients for the NeOmega prerequisite ecosystem"
license = {text = "MIT"}
[tool.setuptools]
packages = ["neomega_clients"]
package-dir = {neomega_clients = "."}
[tool.setuptools.package-data]
neomega_clients = ["py.typed"]
